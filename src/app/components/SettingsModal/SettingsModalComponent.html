@if (isOpen) {
	<div class="modal-backdrop fade show"></div>
	<div class="modal show d-block" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">

				<div class="modal-header">
					<h5 class="modal-title">Settings</h5>
					<button type="button" class="btn-close" (click)="close()"></button>
				</div>

				<div class="modal-body">
					@if (isLoading) {
						<p class="text-secondary">Loading...</p>
					} @else {
						<div class="mb-3">
							<label class="form-label">Default install path</label>
							<div class="input-group">
								<input type="text" class="form-control"
									[(ngModel)]="defaultInstallPath"
									placeholder="Select or type a path…"
								/>
								<button class="btn btn-outline-secondary" type="button"
									(click)="browsePath()"
								><i class="fa-solid fa-folder-open me-1"></i>Browse…</button>
							</div>
							<div class="form-text">Pre-filled when installing a new version.</div>
						</div>

						<div class="form-check mb-3">
							<input class="form-check-input" type="checkbox"
								id="settingShowHiddenVersions"
								[(ngModel)]="showHiddenVersions"
							/>
							<label class="form-check-label" for="settingShowHiddenVersions">
								Show hidden versions in the install list
							</label>
						</div>

						<div class="form-check">
							<input class="form-check-input" type="checkbox"
								id="settingDebugMode"
								[(ngModel)]="debugMode"
							/>
							<label class="form-check-label" for="settingDebugMode">
								Show debug output panel (logs game launch commands and output)
							</label>
						</div>
					}
				</div>

				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" (click)="close()"><i class="fa-solid fa-xmark me-1"></i>Cancel</button>
					<button type="button" class="btn btn-primary"
						(click)="save()"
						[disabled]="isLoading"
					><i class="fa-solid fa-floppy-disk me-1"></i>Save</button>
				</div>

			</div>
		</div>
	</div>
}
