name: Build

# Builds signed NSIS (Windows) and AppImage (Linux) bundles with an
# auto-generated version (0.1.<run number>) and, on pushes to master,
# deploys them together with the updater manifest (latest.json) to
# https://www.knights-tavern.com/installers/launcher/.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY          - content of the updater signing key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - password of that key
#   DEPLOY_SSH_KEY                     - private SSH key authorized on the server
#   DEPLOY_HOST                        - server hostname (e.g. knights-tavern.com)
#   DEPLOY_USER                        - SSH user
#   DEPLOY_PATH                        - target directory served as /installers/launcher

on:
    push:
        branches: [ master ]
    pull_request:
        branches: [ master ]

env:
    LAUNCHER_VERSION: 0.1.${{ github.run_number }}

jobs:
    build-linux:
        runs-on: ubuntu-22.04
        name: Build (Linux)

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: "24"
                    cache: "npm"

            -   name: Install Rust (stable)
                uses: dtolnay/rust-toolchain@stable

            -   name: Cache Rust build artifacts
                uses: Swatinem/rust-cache@v2
                with:
                    workspaces: "./src-tauri -> target"

            -   name: Install system dependencies
                run: |
                    sudo apt-get update
                    sudo apt-get install -y \
                      libwebkit2gtk-4.1-dev \
                      libayatana-appindicator3-dev \
                      librsvg2-dev \
                      patchelf

            -   name: Set version
                run: node -e "const fs = require('fs'); const path = 'src-tauri/tauri.conf.json'; const conf = JSON.parse(fs.readFileSync(path)); conf.version = process.env.LAUNCHER_VERSION; fs.writeFileSync(path, JSON.stringify(conf, null, '\t'));"

            -   name: Install npm dependencies
                run: npm ci

            -   name: Build
                run: npm run tauri build -- --bundles appimage
                env:
                    TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                    TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

            -   name: Upload build artifacts
                uses: actions/upload-artifact@v4
                with:
                    name: linux-build
                    path: |
                        src-tauri/target/release/bundle/appimage/*.AppImage
                        src-tauri/target/release/bundle/appimage/*.AppImage.sig
                    if-no-files-found: error

    build-windows:
        runs-on: windows-latest
        name: Build (Windows)

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: "24"
                    cache: "npm"

            -   name: Install Rust (stable)
                uses: dtolnay/rust-toolchain@stable

            -   name: Cache Rust build artifacts
                uses: Swatinem/rust-cache@v2
                with:
                    workspaces: "./src-tauri -> target"

            -   name: Remove preinstalled NSIS (fix Tauri NSIS macro crash)
                shell: powershell
                run: |
                  if (Get-Command makensis.exe -ErrorAction SilentlyContinue) {
                    Write-Host "Removing existing makensis from PATH"
                    Remove-Item "C:\ProgramData\chocolatey\bin\makensis.exe" -Force
                  }

            -   name: Set version
                run: node -e "const fs = require('fs'); const path = 'src-tauri/tauri.conf.json'; const conf = JSON.parse(fs.readFileSync(path)); conf.version = process.env.LAUNCHER_VERSION; fs.writeFileSync(path, JSON.stringify(conf, null, '\t'));"

            -   name: Install npm dependencies
                run: npm ci

            -   name: Build
                run: npm run tauri build -- --bundles nsis
                env:
                    TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                    TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

            -   name: Upload build artifacts
                uses: actions/upload-artifact@v4
                with:
                    name: windows-build
                    path: |
                        src-tauri/target/release/bundle/nsis/*.exe
                        src-tauri/target/release/bundle/nsis/*.exe.sig
                    if-no-files-found: error

    deploy:
        runs-on: ubuntu-22.04
        name: Deploy to knights-tavern.com
        needs: [ build-linux, build-windows ]
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'

        steps:
            -   name: Download build artifacts
                uses: actions/download-artifact@v4
                with:
                    path: artifacts
                    merge-multiple: true

            -   name: Assemble release directory
                run: |
                    mkdir -p release
                    mv artifacts/*.AppImage release/knights-launcher-amd64.AppImage
                    mv artifacts/*.AppImage.sig release/knights-launcher-amd64.AppImage.sig
                    mv artifacts/*-setup.exe release/knights-launcher-x64-setup.exe
                    mv artifacts/*-setup.exe.sig release/knights-launcher-x64-setup.exe.sig
                    ls -la release/

            -   name: Generate latest.json
                run: |
                    node -e "
                    const fs = require('fs');
                    const base = 'https://www.knights-tavern.com/installers/launcher';
                    const manifest = {
                        version: process.env.LAUNCHER_VERSION,
                        notes: 'Knights Launcher ' + process.env.LAUNCHER_VERSION,
                        pub_date: new Date().toISOString(),
                        platforms: {
                            'linux-x86_64': {
                                signature: fs.readFileSync('release/knights-launcher-amd64.AppImage.sig', 'utf8').trim(),
                                url: base + '/knights-launcher-amd64.AppImage'
                            },
                            'windows-x86_64': {
                                signature: fs.readFileSync('release/knights-launcher-x64-setup.exe.sig', 'utf8').trim(),
                                url: base + '/knights-launcher-x64-setup.exe'
                            }
                        }
                    };
                    fs.writeFileSync('release/latest.json', JSON.stringify(manifest, null, '\t'));
                    "
                    cat release/latest.json

            -   name: Deploy via rsync
                env:
                    DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                    DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                    DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
                    DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
                run: |
                    mkdir -p ~/.ssh
                    echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
                    chmod 600 ~/.ssh/id_deploy
                    ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
                    # Installers first, manifest last, so a client never sees
                    # a manifest pointing at files that are not there yet.
                    rsync -av -e "ssh -i ~/.ssh/id_deploy" \
                      release/knights-launcher-amd64.AppImage \
                      release/knights-launcher-amd64.AppImage.sig \
                      release/knights-launcher-x64-setup.exe \
                      release/knights-launcher-x64-setup.exe.sig \
                      "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
                    rsync -av -e "ssh -i ~/.ssh/id_deploy" \
                      release/latest.json \
                      "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
